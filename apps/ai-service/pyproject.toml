[project]
name = "ai-service"
version = "0.1.0"
description = "AI orchestration worker service for the fitness/nutrition platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  node:
    name: Node workspaces (backend / web / mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsconfig may not exist yet for every app this early in scaffolding -
      # skip rather than fail so this stays valid as apps land incrementally.
      - name: Typecheck backend
        if: hashFiles('apps/backend/tsconfig.json') != ''
        run: npx tsc --noEmit -p apps/backend/tsconfig.json

      - name: Typecheck web
        if: hashFiles('apps/web/tsconfig.json') != ''
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # audit-level=high rather than the default "low" - transitive
      # low/moderate advisories are common noise that would block every PR.
      - name: Dependency audit
        run: npm audit --audit-level=high

  python:
    name: AI service (Python/FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: |
          if find . -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest
          else
            echo "No pytest tests yet - skipping."
          fi

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4

      # Local, credential-free build purely to scan images for vulnerabilities -
      # nothing here is pushed anywhere.
      - name: Build backend image
        if: hashFiles('apps/backend/Dockerfile') != ''
        run: docker build -f apps/backend/Dockerfile -t backend:scan .

      - name: Build ai-service image
        if: hashFiles('apps/ai-service/Dockerfile') != ''
        run: docker build -f apps/ai-service/Dockerfile -t ai-service:scan apps/ai-service

      # Trivy needs no account/secrets to run - swap for Snyk
      # (snyk/actions/docker) if a Snyk org token is ever added to repo secrets.
      # exit-code 0 = report-only for now (a fresh scaffold has no security
      # baseline to compare against yet); flip to "1" once findings are
      # triaged so new HIGH/CRITICAL CVEs actually fail the build.
      - name: Scan backend image (Trivy)
        if: hashFiles('apps/backend/Dockerfile') != ''
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: backend:scan
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Scan ai-service image (Trivy)
        if: hashFiles('apps/ai-service/Dockerfile') != ''
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ai-service:scan
          severity: HIGH,CRITICAL
          exit-code: "0"

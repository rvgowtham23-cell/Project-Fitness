name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write # OIDC federation to AWS - no long-lived AWS keys in repo secrets
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_BACKEND }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -f apps/backend/Dockerfile \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:staging-latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:staging-latest"

      - name: Build and push ai-service image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_AI_SERVICE }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -f apps/ai-service/Dockerfile \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:staging-latest" \
            apps/ai-service
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:staging-latest"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Task definitions already reference each service's `:staging-latest`
      # tag (see infrastructure/environments/staging), so a force-new-deployment
      # is enough to roll out the image just pushed above - no task
      # definition edit needed for a routine app deploy. Infra-level changes
      # (cpu/memory/env vars) go through `terraform apply` in
      # infrastructure/environments/staging instead, run separately/manually.
      - name: Force new deployment (backend)
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_STAGING }}" \
            --service "${{ vars.ECS_SERVICE_BACKEND_STAGING }}" \
            --force-new-deployment

      - name: Force new deployment (ai-service)
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_STAGING }}" \
            --service "${{ vars.ECS_SERVICE_AI_STAGING }}" \
            --force-new-deployment

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_STAGING }}" \
            --services "${{ vars.ECS_SERVICE_BACKEND_STAGING }}" "${{ vars.ECS_SERVICE_AI_STAGING }}"
